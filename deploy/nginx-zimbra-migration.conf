server {
    listen 443 ssl http2;
    server_name migration.example.com;

    ssl_certificate     /etc/letsencrypt/live/migration.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migration.example.com/privkey.pem;

    auth_basic "Zimbra Migration Panel";
    auth_basic_user_file /etc/nginx/.htpasswd-zimbra-migration;

    client_max_body_size 10m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
